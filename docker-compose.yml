version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jaipuria_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-jaipuria-policies}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-pinecone}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - SECRET_KEY=${SECRET_KEY:-jaipuria-prod-secret-key-change-this}
      - STORAGE_DIR=/app/data/documents
      - POLICIES_SOURCE_DIR=/app
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jaipuria_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
